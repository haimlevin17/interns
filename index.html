<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הכשרת פרמדיקים – מרחב לכיש</title>
<meta name="theme-color" content="#0F2B33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230F2B33%22/%3E%3Cpath d=%22M3 18h7l3-8 4 14 3-9 2 3h7%22 stroke=%22%234BF0AC%22 stroke-width=%222.6%22 fill=%22none%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2B33; --ink2:#18404B; --ink3:#245866;
  --paper:#EEF2F0; --surface:#FFFFFF; --line:#D6DFDC; --line2:#E6ECEA;
  --text:#12252B; --muted:#5A6E75;
  --signal:#F2551C; --signal-soft:#FDE9E0;
  --ok:#0B8F63; --ok-soft:#DDF3EA;
  --warn:#A56F00; --warn-soft:#FBEFD2;
  --bad:#C73434; --bad-soft:#FBE3E3;
  --trace:#4BF0AC;
  --display:"Karantina","Assistant",sans-serif;
  --body:"Assistant",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-size:17px;line-height:1.5;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--display);font-weight:700;line-height:.95;letter-spacing:.01em}
.muted{color:var(--muted)}
.sm{font-size:14.5px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* reflective stripe — the ambulance-side marking */
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--signal) 0 14px,#FFD23F 14px 28px)}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--ink)}
.auth-hero{color:#fff;padding:34px 24px 26px;position:relative;overflow:hidden}
.auth-hero h1{font-size:clamp(58px,17vw,96px)}
.auth-hero .where{font-family:var(--display);font-size:30px;color:var(--trace);margin-top:2px}
.auth-hero svg.ecg{display:block;width:100%;height:64px;margin-top:18px}
.ecg path{stroke:var(--trace);stroke-width:2.2;fill:none;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s .2s ease-out forwards;filter:drop-shadow(0 0 5px rgba(75,240,172,.7))}
@keyframes draw{to{stroke-dashoffset:0}}
.auth-sheet{background:var(--paper);border-radius:26px 26px 0 0;padding:26px 22px 40px}
.auth-in{max-width:440px;margin:0 auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#DDE5E2;border-radius:14px;padding:4px;gap:4px}
.seg button{height:42px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(15,43,51,.18)}
.demo{margin-top:26px;padding-top:20px;border-top:1px dashed #B9C6C2}
.demo .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

/* ---------- forms ---------- */
.f{display:grid;gap:16px;margin-top:20px}
label.fl{display:grid;gap:6px;font-weight:600;font-size:15.5px}
label.fl small{font-weight:400;color:var(--muted)}
.in{width:100%;min-height:50px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
textarea.in{min-height:92px;resize:vertical;line-height:1.45}
.in:focus{outline:0;border-color:var(--ink3);box-shadow:0 0 0 3px rgba(36,88,102,.16)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:700;background:var(--ink);color:#fff}
.btn:active{transform:translateY(1px)}
.btn.signal{background:var(--signal)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.soft{background:#DDE5E2;color:var(--ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:15px;border-radius:11px}
.btn.wide{width:100%}
.btn.danger{background:var(--bad)}
.err{background:var(--bad-soft);color:#8C1F1F;padding:11px 14px;border-radius:12px;font-weight:600;font-size:15.5px}
.note{background:var(--warn-soft);color:#6B4700;padding:11px 14px;border-radius:12px;font-size:15px}

/* ---------- shell ---------- */
.shell{min-height:100%;padding-bottom:86px}
.top{background:var(--ink);color:#fff}
.top-in{display:flex;align-items:center;gap:12px;padding:14px 18px;max-width:1080px;margin:0 auto}
.top .brand{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.top .brand span{color:var(--trace)}
.top .who{white-space:nowrap;margin-inline-start:auto;text-align:left;font-size:14px;line-height:1.25;opacity:.9}
.main{max-width:760px;margin:0 auto;padding:20px 16px 70px}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{display:grid;justify-items:center;gap:2px;padding:7px 2px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--muted);position:relative}
.nav button[aria-current=page]{color:var(--ink);background:var(--paper)}
.nav button[aria-current=page] svg{stroke:var(--signal)}
.nav .desk{display:none}
.badge{position:absolute;top:2px;inset-inline-end:calc(50% - 24px);min-width:19px;height:19px;border-radius:10px;background:var(--signal);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
@media (min-width:900px){
  .shell{padding-bottom:0;padding-inline-start:232px}
  .nav{inset:0 0 0 auto;width:232px;grid-auto-flow:row;grid-auto-rows:min-content;align-content:start;gap:4px;padding:92px 14px 20px;background:var(--ink);border:0}
  .nav button{grid-auto-flow:column;justify-content:start;justify-items:start;align-items:center;gap:12px;padding:12px 14px;font-size:16.5px;color:#B9CCD1}
  .nav button[aria-current=page]{background:var(--ink2);color:#fff}
  .nav .desk{display:grid}.nav .mob{display:none}
  .badge{position:static;margin-inline-start:auto}
  .top{position:sticky;top:0;z-index:30}
  .top-in{max-width:none}
  .main{padding:30px 28px 50px}
}

.h-row{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 10px}
.h-row:first-child{margin-top:0}
h2.t{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
h3.s{font-size:18px;font-weight:700}
.link{color:var(--ink3);font-weight:700;font-size:15.5px;text-decoration:underline;text-underline-offset:3px}

/* ---------- monitor (signature) ---------- */
.mon{background:var(--ink);color:#fff;border-radius:22px;padding:18px 18px 14px;position:relative;overflow:hidden}
.mon-head{display:flex;justify-content:space-between;align-items:start;gap:12px}
.mon .lab{font-size:14.5px;color:#A9C0C6}
.mon .state{font-family:var(--display);font-weight:700;font-size:54px;line-height:.95;margin-top:2px}
.mon .state.up{color:var(--trace)} .mon .state.flat{color:#FFD23F} .mon .state.down{color:#FF8A6B} .mon .state.down.soft{color:#9FDCEB} .mon .state.none{color:#D4E0E3;font-size:34px;line-height:1.05}
.mon .big{font-family:var(--display);font-size:54px;font-weight:700;line-height:.95;text-align:left}
.mon .big small{font-family:var(--body);font-size:14px;font-weight:400;color:#A9C0C6;display:block;line-height:1.2}
.mon svg.chart{display:block;width:100%;height:auto;margin-top:10px;direction:ltr}
.mon .explain{font-size:14.5px;color:#C9D8DC;margin-top:8px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;background:var(--surface);border-radius:18px;border:1px solid var(--line)}
.kpis div{padding:14px 12px;text-align:center}
.kpis div+div{border-inline-start:1px solid var(--line2)}
.kpis b{font-family:var(--display);font-size:42px;line-height:.95;display:block}
.kpis span{font-size:14px;color:var(--muted)}

/* ---------- shift log ---------- */
.log{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.log details+details,.log .rowi+.rowi{border-top:1px solid var(--line2)}
.log summary{list-style:none;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:13px 14px;cursor:pointer}
.log summary::-webkit-details-marker{display:none}
.dblock{background:var(--paper);border-radius:12px;text-align:center;padding:6px 0 5px}
.dblock b{font-family:var(--display);font-size:32px;line-height:.9;display:block}
.dblock span{font-size:12.5px;color:var(--muted);display:block;line-height:1.1}
.sum-t{font-weight:700}
.sum-s{font-size:14.5px;color:var(--muted)}
.chev{transition:transform .18s;color:var(--muted)}
details[open] .chev{transform:rotate(-90deg)}
.det{padding:4px 16px 18px;display:grid;gap:14px}
.det dt{font-size:14px;color:var(--muted);font-weight:600}
.det dd{margin:2px 0 0;white-space:pre-wrap}
.det dl{margin:0;display:grid;gap:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:600;background:var(--paper);color:var(--ink)}
.tag.ok{background:var(--ok-soft);color:#075E41}
.tag.bad{background:var(--bad-soft);color:#8C1F1F}
.tag.warn{background:var(--warn-soft);color:#6B4700}
.tag.sig{background:var(--signal-soft);color:#9A2F08}
.tag svg{width:15px;height:15px;stroke-width:2.4}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:4px}

/* ---------- procedures ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.yn{display:flex;gap:6px}
.yn button{min-height:42px;padding:0 14px;border-radius:11px;border:1.5px solid var(--line);font-weight:700;font-size:15px;background:var(--surface)}
.yn button.y[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button.n[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.ptable{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.pline{display:grid;grid-template-columns:104px 1fr 92px;gap:12px;align-items:center;padding:13px 0}
.pline+.pline{border-top:1px solid var(--line2)}
.pline .nm{font-weight:700}
.bar{height:12px;border-radius:6px;background:var(--paper);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)} .bar .q{background:#B9C8CC}
.pline .ct{text-align:left;font-size:14.5px;color:var(--muted)}
.pline .ct b{color:var(--text);font-size:16px}
.insight{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.insight p{display:grid;grid-template-columns:22px 1fr;gap:10px}
.insight svg{margin-top:2px}

/* ---------- feedback ---------- */
.fb{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--paper);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.score{font-family:var(--display);font-size:40px;font-weight:700;line-height:1}
.score small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.up-box{border:1.5px dashed #9FB2AE;border-radius:14px;padding:16px;text-align:center;background:var(--surface);display:grid;gap:8px;justify-items:center;cursor:pointer}
.up-box img{max-height:180px;border-radius:10px;max-width:100%}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;direction:ltr}
.scale button{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.scale button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- lists / mentor ---------- */
.rowi{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px 16px;width:100%;text-align:start}
button.rowi:hover{background:#F7F9F8}
.rowi .nm{font-weight:700;font-size:18px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:14px 0}
.pill{flex:none;min-height:40px;padding:0 15px;border-radius:999px;background:#DDE5E2;font-weight:600;font-size:15.5px;color:var(--ink)}
.pill[aria-pressed=true]{background:var(--ink);color:#fff}
.thead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.back{width:44px;height:44px;border-radius:12px;background:#DDE5E2;display:grid;place-items:center}
.inq{padding:16px;display:grid;gap:8px}
.inq+.inq{border-top:1px solid var(--line2)}
.reply{background:var(--paper);border-radius:12px;padding:10px 12px;border-inline-start:4px solid var(--ink3)}
.soon{background:var(--surface);border:1.5px dashed #9FB2AE;border-radius:18px;padding:30px 22px;text-align:center}
.soon .disp{font-size:40px;margin-bottom:6px}

/* ---------- overlay ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(9,26,31,.62);display:grid;place-items:center;padding:20px}
.dlg{background:var(--surface);border-radius:20px;padding:22px;max-width:420px;width:100%;display:grid;gap:14px;max-height:90vh;overflow:auto}
.dlg img{max-width:100%;border-radius:12px}
.pw{font-family:var(--display);font-size:60px;font-weight:700;letter-spacing:.08em;text-align:center;direction:ltr;background:var(--paper);border-radius:14px;padding:10px}
.toast{position:fixed;z-index:60;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;box-shadow:0 8px 24px rgba(15,43,51,.3);white-space:nowrap}
.fab{position:fixed;z-index:15;bottom:96px;inset-inline-start:18px;box-shadow:0 8px 22px rgba(242,85,28,.4)}
@media (min-width:900px){.fab{bottom:28px;inset-inline-start:28px}.toast{bottom:30px}}
.sticky-save{position:sticky;bottom:86px;padding:12px 0;background:linear-gradient(to top,var(--paper) 70%,transparent)}
@media (min-width:900px){.sticky-save{bottom:0}}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:700;font-size:15.5px;padding:0;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ecg path{stroke-dashoffset:0}}
.nav button{font-size:11.5px}
@media (min-width:900px){.nav button{font-size:16.5px}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}
.qcard+.qcard{margin-top:12px}
.qcard .qn{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;color:var(--ink3)}
.opt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;width:100%;text-align:start;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #9FB2AE;margin-top:2px;display:grid;place-items:center}
.opt[aria-pressed=true]{border-color:var(--ink);background:#F1F5F4}
.opt[aria-pressed=true] .rd{border-color:var(--ink)}
.opt[aria-pressed=true] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt.key[aria-pressed=true]{border-color:var(--ok);background:var(--ok-soft)}
.opt.key[aria-pressed=true] .rd{border-color:var(--ok)}.opt.key[aria-pressed=true] .rd::after{background:var(--ok)}
.radios{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;direction:ltr}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.radios span{display:grid;place-items:center;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.radios input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.radios input:focus-visible+span{outline:3px solid var(--signal);outline-offset:2px}
.ver{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding-bottom:2px}
.day{aspect-ratio:1/1.08;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;grid-template-rows:auto 1fr;justify-items:center;padding:5px 2px 4px;font-weight:700;font-size:16px;line-height:1}
.day .mo{font-size:10.5px;font-weight:600;color:var(--muted)}
.day .mk{display:flex;gap:2px;align-items:end;justify-content:center;flex-wrap:wrap}
.day .mk i{font-style:normal;font-size:10.5px;font-weight:700;width:15px;height:15px;border-radius:4px;display:grid;place-items:center;background:var(--signal-soft);color:#9A2F08}
.day.all{background:var(--ink);border-color:var(--ink);color:#fff}
.day.all .mo{color:#A9C0C6}
.day.part{border-color:var(--signal)}
.day.sel{outline:3px solid var(--ink3);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin:10px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:16px;height:16px;border-radius:5px;display:inline-block;border:1.5px solid var(--line);background:var(--surface)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;display:grid;gap:12px}
.tog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tog button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.tog button[aria-pressed=true]{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.full[aria-pressed=true]{background:var(--ink);color:#fff}
.grid-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;max-height:70vh}
table.av{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
table.av th,table.av td{padding:0;text-align:center;border-bottom:1px solid var(--line2);height:40px;min-width:40px}
table.av thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:700;line-height:1.1;padding:6px 2px}
table.av thead th small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
table.av thead th.we{background:#F3F6F5}
table.av .nm{position:sticky;right:0;background:var(--surface);z-index:1;text-align:start;padding:0 12px;white-space:nowrap;font-weight:700;min-width:120px;border-inline-end:1px solid var(--line)}
table.av thead .nm{z-index:3}
table.av td.x{background:var(--ink);color:#fff;font-weight:700}
table.av td.p{color:#9A2F08;font-weight:700;background:var(--signal-soft);font-size:12.5px;letter-spacing:.02em}
table.av tfoot td{background:#F7F9F8;font-size:12.5px;line-height:1.15;font-weight:600}
table.av tfoot .nm{background:#F7F9F8;font-weight:600}
.cnt-low{color:var(--bad)}
.top .out{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:#fff;margin-inline-start:6px}
@media (min-width:900px){.top .out{display:none}}
.main.wide{max-width:1400px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ---------- analysis ---------- */
function stats(uidv){
  var sh=db.shifts.filter(function(s){return s.userId===uidv;}).sort(function(a,b){return a.date<b.date?1:-1;});
  var fb=sh.filter(function(s){return s.feedback&&s.feedback.done&&s.feedback.score;}).slice().reverse();
  var scores=fb.map(function(s){return +s.feedback.score;});
  var pr={};PROCS.forEach(function(p){pr[p]={n:0,ok:0,last:[]};});
  sh.slice().reverse().forEach(function(s){(s.procedures||[]).forEach(function(p){if(pr[p.name]){pr[p.name].n++;if(p.ok)pr[p.name].ok++;pr[p.name].last.push(p.ok);}});});
  var tn=0,tok=0;PROCS.forEach(function(p){tn+=pr[p].n;tok+=pr[p].ok;});
  return {shifts:sh,fb:fb,scores:scores,procs:pr,tn:tn,tok:tok,trend:trend(scores)};
}
function trend(sc){
  var n=sc.length;if(n<3)return {state:"none",slope:0};
  var mx=(n-1)/2,my=avg(sc),num=0,den=0;
  sc.forEach(function(y,x){num+=(x-mx)*(y-my);den+=(x-mx)*(x-mx);});
  var sl=num/den;
  var k=Math.min(3,Math.floor(n/2)),recent=avg(sc.slice(n-k)),before=avg(sc.slice(0,n-k));
  return {state:sl>0.15?"up":sl<-0.15?"down":"flat",slope:sl,recent:recent,before:before,k:k,icept:my-sl*mx};
}
var TXT={up:"ממשיכים לעלות",flat:"קצב יציב",down:"זמן להתמקד",none:"הדרך רק מתחילה"};
var TXTM={up:"במגמת שיפור",flat:"נשאר יציב",down:"דורש תשומת לב",none:"עוד אין מספיק משובים"};
function trendTag(t){
  if(t.state==="none")return '<span class="tag">'+ic("dot")+'אין מגמה עדיין</span>';
  var c={up:"ok",flat:"warn",down:"bad"}[t.state],w={up:"משתפר",flat:"יציב",down:"דורש תשומת לב"}[t.state];
  return '<span class="tag '+c+'">'+ic(t.state)+w+'</span>';
}

/* ---------- monitor ---------- */
function monitor(st,mv){
  var t=st.trend,sc=st.scores,W=340,H=120,pl=8,pr=8,pt=10,pb=10;
  var g="";for(var i=0;i<=4;i++){var gy=pt+(H-pt-pb)*i/4;g+='<line x1="0" x2="'+W+'" y1="'+gy+'" y2="'+gy+'" stroke="#1E4954" stroke-width="1"/>';}
  for(var j=1;j<12;j++){var gx=W*j/12;g+='<line y1="0" y2="'+H+'" x1="'+gx+'" x2="'+gx+'" stroke="#16393F" stroke-width="1"/>';}
  function X(i){return sc.length<2?W/2:pl+(W-pl-pr)*i/(sc.length-1);}
  function Y(v){return pt+(H-pt-pb)*(1-(v-1)/9);}
  var body="";
  if(sc.length){
    var pts=sc.map(function(v,i){return X(i).toFixed(1)+","+Y(v).toFixed(1);}).join(" ");
    if(t.state!=="none")body+='<line x1="'+X(0)+'" y1="'+Y(t.icept)+'" x2="'+X(sc.length-1)+'" y2="'+Y(t.icept+t.slope*(sc.length-1))+'" stroke="#fff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 5"/>';
    if(sc.length>1)body+='<polyline points="'+pts+'" fill="none" stroke="#4BF0AC" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(75,240,172,.7))"/>';
    sc.forEach(function(v,i){var last=i===sc.length-1;body+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(last?6:3.5)+'" fill="'+(last?"#fff":"#4BF0AC")+'" stroke="#4BF0AC" stroke-width="'+(last?3:0)+'"/>';});
  }else{
    body='<path d="M0 '+H/2+'H'+W+'" stroke="#2C6270" stroke-width="2" stroke-dasharray="3 7"/>';
  }
  var ex;
  if(t.state==="none")ex=sc.length?"יש "+sc.length+" משובים. מגמה מחושבת החל מ־3 משובים.":"כשיתועדו משובים, הציונים יופיעו כאן לאורך זמן.";
  else{ex="ממוצע "+t.k+" המשובים האחרונים "+r1(t.recent)+", לעומת "+r1(t.before)+" לפני כן.";
    if(!mv)ex+={up:" העבודה שלך נראית. כל הכבוד.",flat:" יציבות היא בסיס טוב לצעד הבא.",down:" זה חלק טבעי מהדרך. שווה לעבור עם החונך על הדגשים ולבחור דבר אחד להתמקד בו."}[t.state];}
  var label="ציוני "+sc.length+" משובים לפי סדר: "+sc.join(", ");
  return '<section class="mon"><div class="mon-head"><div><div class="lab">מגמת משובים</div><div class="state '+t.state+(mv?"":" soft")+'">'+(mv?TXTM:TXT)[t.state]+'</div></div>'+
    (sc.length?'<div class="big">'+sc[sc.length-1]+'<small>משוב אחרון<br>מתוך 10</small></div>':'')+'</div>'+
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+g+body+'</svg>'+
    (st.fb.length>1?'<div class="mon-head lab" style="direction:ltr;font-size:13px"><span>'+fdate(st.fb[0].date)+'</span><span>'+fdate(st.fb[st.fb.length-1].date)+'</span></div>':'')+
    '<p class="explain">'+ex+'</p></section>';
}

      '<span class="ct">'+(x.n?'<b>'+x.ok+'/'+x.n+'</b> · '+Math.round(g)+'%':"טרם בוצע")+'</span></div>';});
  h+='</div><div class="h-row"><h3 class="s">סיכום איכותי</h3></div><div class="insight">';

function parseExamXml(xml){
  var doc=new DOMParser().parseFromString(xml,"application/xml"),paras=[];
  function kid(el,n){for(var i=0;i<el.childNodes.length;i++)if(el.childNodes[i].nodeName===n)return el.childNodes[i];return null;}
  function on(e){if(!e)return false;var v=e.getAttribute("w:val");return v!=="0"&&v!=="false"&&v!=="none";}
  [].forEach.call(doc.getElementsByTagName("w:p"),function(p){
    var text="",len={hl:0,col:0,b:0,u:0};
    [].forEach.call(p.getElementsByTagName("w:r"),function(r){
      var t="";[].forEach.call(r.childNodes,function(n){if(n.nodeName==="w:t")t+=n.textContent;else if(n.nodeName==="w:tab"||n.nodeName==="w:br")t+=" ";});
      if(!t)return;text+=t;

      var sh=kid(pr,"w:shd"),c=kid(pr,"w:color"),fill=sh?(sh.getAttribute("w:fill")||"").toUpperCase():"",cv=c?(c.getAttribute("w:val")||"").toUpperCase():"";
      if(on(kid(pr,"w:highlight"))||(fill&&fill!=="AUTO"&&fill!=="FFFFFF"))len.hl+=L;
      if(cv&&cv!=="AUTO"&&cv!=="000000")len.col+=L;
      if(on(kid(pr,"w:b"))||on(kid(pr,"w:bCs")))len.b+=L;
      if(on(kid(pr,"w:u")))len.u+=L;
    });
    text=text.replace(/\s+/g," ").trim();if(!text)return;
    var tot=text.replace(/\s/g,"").length||1,m={};for(var k in len)m[k]=len[k]/tot>.5;
    var np=p.getElementsByTagName("w:numPr")[0],numId=null,ilvl=0;
    if(np){var a=np.getElementsByTagName("w:numId")[0],b=np.getElementsByTagName("w:ilvl")[0];numId=a?a.getAttribute("w:val"):null;ilvl=b?+b.getAttribute("w:val"):0;}
    paras.push({text:text,m:m,numId:numId,ilvl:ilvl});
  });
  var OPT=/^\(?([א-י]|[a-hA-H])['׳]?\s*[.)\-–:]\s*/,QN=/^(שאלה\s*)?\d+\s*[.)\-–:]\s*/;
  var nOpt=paras.filter(function(p){return OPT.test(p.text);}).length;
  var deep=paras.some(function(p){return p.numId&&p.ilvl>0;});
  var ids={},firstId=null;paras.forEach(function(p){if(p.numId){ids[p.numId]=1;if(firstId===null)firstId=p.numId;}});
  var multi=Object.keys(ids).length>1,qs=[],cur=null;
  paras.forEach(function(p){
    var isOpt,isQ;
    if(nOpt>=4){isOpt=OPT.test(p.text);isQ=!isOpt;}
    else if(deep){isOpt=!!p.numId&&p.ilvl>0;isQ=!isOpt;}
    else{isQ=QN.test(p.text)||(multi&&p.numId===firstId)||/[?:]$/.test(p.text);isOpt=!isQ;}
    if(isOpt){if(cur)cur.opts.push({t:p.text.replace(OPT,""),m:p.m});return;}
    if(cur&&!cur.opts.length&&QN.test(cur.raw)&&!QN.test(p.text)&&nOpt>=4){cur.q+=" "+p.text;return;}
    cur={raw:p.text,q:p.text.replace(QN,""),opts:[]};qs.push(cur);
  });
  return qs.filter(function(q){return q.opts.length>=2;}).map(function(q){
    var correct=-1;["hl","col","b","u"].some(function(k){var ix=[];q.opts.forEach(function(o,i){if(o.m[k])ix.push(i);});if(ix.length===1){correct=ix[0];return true;}return false;});
    return {q:q.q,opts:q.opts.map(function(o){return o.t;}),correct:correct};
  });
